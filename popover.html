<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нумерация токенов</title>
    <style>
      :root {
        --fg: #fff;
        --muted: rgba(255, 255, 255, 0.65);
        --accent: #bb99ff;
        --accent-fg: #1b1b26;
        --border: rgba(255, 255, 255, 0.2);
        --danger: #ff6b6b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: transparent; color: var(--fg); font: 13px/1.4 Roboto, system-ui, sans-serif; }
      body { padding: 12px 14px 14px; }
      h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
      p { margin: 0; }
      .muted { color: var(--muted); }
      .small { font-size: 11.5px; margin-top: 10px; }
      hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
      .stack { display: grid; gap: 6px; margin-top: 8px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      button {
        font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--border);
        border-radius: 8px; padding: 8px 10px; cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.4; cursor: default; }
      button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
      button.danger { color: var(--danger); border-color: var(--danger); width: 100%; }
      .msg { min-height: 18px; margin-top: 8px; color: var(--accent); }
      .check { display: flex; gap: 8px; align-items: center; margin: 8px 0; cursor: pointer; }
      .field { display: grid; gap: 4px; margin: 10px 0; }
      .field .head { display: flex; justify-content: space-between; }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      select, input[type="number"] {
        font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--border);
        border-radius: 8px; padding: 6px 8px; width: 100%;
      }
      select option { color: #000; }
    </style>
  </head>
  <body>
    <div id="app" hidden>
      <h1>Нумерация токенов</h1>
      <p class="muted" id="selInfo">Выделите токены на карте</p>

      <div class="stack">
        <button id="btnNumber" class="primary" disabled>Пронумеровать выбранные</button>
        <div class="row">
          <button id="btnRenumber" disabled>Заново</button>
          <button id="btnClear" disabled>Убрать у выбранных</button>
        </div>
      </div>
      <p class="msg" id="msg" aria-live="polite"></p>

      <hr />

      <label class="check"><input type="checkbox" id="visible" /> Показывать номера (только мне)</label>

      <div class="field">
        <div class="head"><span>Прозрачность</span><span id="opacityVal"></span></div>
        <input type="range" id="opacity" min="10" max="100" step="5" />
      </div>
      <div class="field">
        <div class="head"><span>Размер</span><span id="sizeVal"></span></div>
        <input type="range" id="size" min="10" max="50" step="2" />
      </div>
      <label class="field">
        <span>Угол токена</span>
        <select id="corner">
          <option value="tl">Левый верхний</option>
          <option value="tr">Правый верхний</option>
          <option value="bl">Левый нижний</option>
          <option value="br">Правый нижний</option>
        </select>
      </label>
      <label class="field">
        <span>Порядок нумерации</span>
        <select id="order">
          <option value="reading">Слева направо, сверху вниз</option>
          <option value="selection">В порядке выделения</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="byName" /> Считать отдельно для каждого имени</label>
      <label class="field">
        <span>Начинать с</span>
        <input type="number" id="start" min="1" step="1" />
      </label>

      <hr />
      <button id="btnClearAll" class="danger">Убрать все номера на сцене</button>
      <p class="muted small">Игрокам номера не показываются: они рисуются только в браузере мастера.</p>
    </div>

    <div id="noGm" hidden>
      <h1>Нумерация токенов</h1>
      <p class="muted">Расширение работает только у мастера.</p>
    </div>

    <script type="module" src="./popover.js"></script>
  </body>
</html>
